<app-wrapper-header text="Visión general de hoy"></app-wrapper-header>
<div class="wrapper">
  @for (actualWeatherCard of actualWeatherCards; track actualWeatherCard) {
    <div class="info-item-card app-card">
      <app-card-info [showIcon]="!isSmallScreen" [icon]="actualWeatherCard.icon" [title]="actualWeatherCard.title" [text]="actualWeatherCard.text" ></app-card-info>
    </div>
  }
</div>
