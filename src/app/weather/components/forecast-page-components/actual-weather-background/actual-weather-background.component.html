<div class="wrapper">
  <pw-sky-gradient [isCloudy]="weatherCodeData.isCloudy" [actualHour]="setHour()"></pw-sky-gradient>
  @if (weatherCodeData.cloudLevel > 0) {
    <pw-clouds [isCloudy]="weatherCodeData.isCloudy" [cloudsLevel]="weatherCodeData.cloudLevel" [actualHour]="setHour()"></pw-clouds>
  }
  @if ((setHour() > 17 || setHour() < 7) && !weatherCodeData.isCloudy) {
    <pw-stars [actualHour]="setHour()"></pw-stars>
  }
  @if ((setHour() > 7 && setHour() < 17) && weatherCodeData.isShowingSun) {
    <pw-sun></pw-sun>
  }
  @if (weatherCodeData.isRain) {
    <pw-rain></pw-rain>
  }
</div>
