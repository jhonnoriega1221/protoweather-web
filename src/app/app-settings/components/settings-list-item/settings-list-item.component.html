<a [routerLink]=url class="list-item">
  <div class="list-item-text">
    <div class="list-item-text-icon">
      <i class="fa-solid" [ngClass]="'fa-'+icon"></i>
    </div>
    <div class="list-item-text-name">
      <p class="list-item-text-name-title">{{title}}</p>
      <p class="list-item-text-name-description">{{description}}</p>
    </div>
  </div>
  <div class="list-item-option">
    @if (type === 'select') {
      <div class="list-item-option-select">
        <select [ngModel]="selectedValue" (ngModelChange)="changeOption($event)">
          @for (option of optionsList; track option) {
            <option [ngValue]="option.value">{{option.name}}</option>
          }
        </select>
        <i class="fa-solid fa-angle-right list-item-option-icon"></i>
      </div>
    }

    @if (type === 'url' && url) {
      <i class="fa-solid fa-angle-right list-item-route-icon"></i>
    }

    @if ( type=== 'toggle') {
      <input pw-toggle type="checkbox" name="toggle">
    }
  </div>
</a>
